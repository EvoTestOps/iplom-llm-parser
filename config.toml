[pipeline]
content_col = "Content"
chunk_size = 10000
llm_sample_n = 5
repool_passes = 2
template_correction = true
infer_slot_regexes = true
singleton_fallback = true

[llm]
provider = "local"
model = "google/gemma-4-26b-a4b-qat"
max_concurrent = 4
timeout = 60
max_tokens_per_log = 0
base_url = "http://localhost:1234/v1"
prompt = "default"
reasoning = false
temperature = 0.0
# api_key = "..." # prefer API_KEY env var

[iplom]
CT = 0.35
lower_bound = 0.25
